name: 更新 ETA 數據

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出倉庫
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0          # 獲取完整歷史，方便 reset

      - name: 強制同步遠端最新代碼（避免衝突）
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: pip install hk-bus-eta

      - name: 執行抓取腳本
        run: python fetch_eta.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eta-data.json
          git commit -m "自動更新 ETA 數據 [skip ci]" || echo "無變更"
          git push origin main
