name: 更新 ETA 數據

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出倉庫
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install hk-bus-eta requests

      - name: 執行抓取腳本
        run: python fetch_eta.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eta-data.json
          git commit -m "自動更新 ETA 數據 [skip ci]" || echo "無變更"
          git push
