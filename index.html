<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝴蝶邨・屯門碼頭交通時間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap');
        body { font-family: 'Noto Serif TC', serif; }
    </style>
</head>
<body class="bg-[#FBFBFA] text-[#222222] min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md space-y-6 pb-8">
        
        <!-- 標題與更新時間 -->
        <header class="py-4 border-b border-[#E5E5E3] flex justify-between items-end">
            <div>
                <h1 class="text-lg font-semibold tracking-wider">此刻 · 交通</h1>
                <p class="text-[11px] text-[#777] mt-0.5">更新時間：<span id="update-time">載入中...</span></p>
            </div>
            <button onclick="fetchAllData()" class="text-xs bg-[#EFEFED] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-lg text-[#555] transition">
                重新整理 ⟳
            </button>
        </header>

        <!-- 區塊：九巴 (KMB) 實時班次 -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">九巴 (KMB) 實時班次</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                
                <!-- 59X -->
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-medium text-sm">59X <span class="text-[10px] text-[#999]">屯門碼頭總站</span></span>
                    </div>
                    <div id="eta-59x" class="text-xs text-[#666] flex gap-2">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

                <!-- K52 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-medium text-sm">K52 <span class="text-[10px] text-[#999]">屯門碼頭總站</span></span>
                    </div>
                    <div id="eta-k52" class="text-xs text-[#666] flex gap-2">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

            </div>
        </section>

        <!-- 區塊：城巴 (CTB) 及 港鐵 (MTR) 提示 -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">其他路線與輕鐵</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                
                <!-- 962 / 962X -->
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-medium text-sm">962 / 962X <span class="text-[10px] text-[#999]">往港島</span></span>
                    </div>
                    <div id="eta-962" class="text-xs text-[#666] flex gap-2">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

                <!-- 輕鐵 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-medium text-sm">輕鐵 (蝴蝶站 / 碼頭)</span>
                    </div>
                    <div class="text-xs text-[#888] bg-[#F9F9F8] p-2 rounded">
                        MTR 輕鐵暫未開放直接前端 API，請留意站內顯示屏
                    </div>
                </div>

            </div>
        </section>

        <!-- 頁尾 -->
        <footer class="text-center text-[10px] text-[#B8B8B6] pt-2">
            蝴蝶邨 ⇄ 屯門碼頭交通面板
        </footer>
    </div>

    <script>
        // 計算剩餘分鐘數
        function getMinutes(etaString) {
            if (!etaString) return null;
            const diff = new Date(etaString) - new Date();
            const mins = Math.round(diff / 60000);
            return mins <= 0 ? '即將到達' : mins + ' 分鐘';
        }

        // 渲染 ETA 標籤到畫面上
        function renderEtas(elementId, etaList) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            
            if (!etaList || etaList.length === 0) {
                container.innerHTML = '<span class="text-stone-400 bg-stone-50 px-2 py-1 rounded">暫無班次</span>';
                return;
            }

            // 取最多前 3 個班次
            const top3 = etaList.slice(0, 3);
            top3.forEach(item => {
                const timeText = getMinutes(item.eta);
                const span = document.createElement('span');
                span.className = 'bg-[#F2F2F0] px-2.5 py-1 rounded text-stone-700 font-medium';
                span.innerText = timeText;
                container.appendChild(span);
            });
        }

        // 抓取九巴數據
        async function fetchKMB(route, stopId, elementId) {
            try {
                const response = await fetch(`https://etav3.kmb.hk/v1/transport/kmb/stop-eta/${stopId}/${route}/1`);
                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                
                // 過濾出該路線的班次
                const etas = result.data ? result.data.filter(item => item.route === route) : [];
                renderEtas(elementId, etas);
            } catch (error) {
                console.error(`Error fetching ${route}:`, error);
                document.getElementById(elementId).innerHTML = '<span class="text-red-500 bg-red-50 px-2 py-1 rounded">[Error] 無法取得數據</span>';
            }
        }

        // 抓取城巴數據 (962 示範)
        async function fetchCitybus(route, stopId, elementId) {
            try {
                // 城巴 API 範例端點
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/citybus/eta/ctb/${stopId}/${route}`);
                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                
                const etas = result.data ? result.data.map(item => ({ eta: item.eta })) : [];
                renderEtas(elementId, etas);
            } catch (error) {
                console.error(`Error fetching ${route}:`, error);
                document.getElementById(elementId).innerHTML = '<span class="text-red-500 bg-red-50 px-2 py-1 rounded">[Error] 無法取得數據</span>';
            }
        }

        // 總控：抓取所有路線
        async function fetchAllData() {
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + 
                               now.getMinutes().toString().padStart(2, '0') + ':' + 
                               now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('update-time').innerText = timeString + " (更新中...)";

            // 屯門碼頭總站代號：九巴 TM883 等，如遇官方代號變更會顯示 Error
            await Promise.all([
                fetchKMB('59X', 'TM883', 'eta-59x'),
                fetchKMB('K52', 'TM883', 'eta-k52'),
                // 962 港島方向站點作示範
                fetchCitybus('962', '002778', 'eta-962') 
            ]);

            document.getElementById('update-time').innerText = timeString;
        }

        // 網頁開啟時自動抓取
        window.onload = function() {
            fetchAllData();
        };
    </script>
</body>
</html>
