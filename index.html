<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝴蝶邨・屯門碼頭交通時間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap');
        body { font-family: 'Noto Serif TC', serif; }
    </style>
</head>
<body class="bg-[#FBFBFA] text-[#222222] min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md space-y-6 pb-8">
        
        <!-- 標題與更新時間 -->
        <header class="py-4 border-b border-[#E5E5E3] flex justify-between items-end">
            <div>
                <h1 class="text-lg font-semibold tracking-wider">此刻 · 交通</h1>
                <p class="text-[11px] text-[#777] mt-1">更新時間：<span id="update-time">載入中...</span></p>
            </div>
            <button onclick="fetchAllData()" class="text-xs bg-[#EFEFED] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-lg text-[#555] transition">
                重新整理 ⟳
            </button>
        </header>

        <!-- 區塊：九巴實時班次 (蝴蝶邨/碼頭一帶) -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">九巴 (KMB) 實時班次</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                
                <!-- 59X (湖景邨湖畔樓 TM646) -->
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">59X <span class="text-[10px] text-[#999]">湖畔樓 (往旺角)</span></span>
                    </div>
                    <div id="eta-59x" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

                <!-- 59M (蝴蝶邨蝶心樓 TM630) -->
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">59M <span class="text-[10px] text-[#999]">蝶心樓 (往荃灣)</span></span>
                    </div>
                    <div id="eta-59m" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

                <!-- 59A (蝴蝶邨蝶心樓 TM630) -->
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">59A <span class="text-[10px] text-[#999]">蝶心樓</span></span>
                    </div>
                    <div id="eta-59a" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

                <!-- N260 (蝴蝶邨蝶心樓 TM630) -->
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">N260 <span class="text-[10px] text-[#999]">蝶心樓 (通宵)</span></span>
                    </div>
                    <div id="eta-n260" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

                <!-- 259B (蝴蝶邨蝶心樓 TM630) -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">259B <span class="text-[10px] text-[#999]">蝶心樓</span></span>
                    </div>
                    <div id="eta-259b" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>

            </div>
        </section>

        <!-- 頁尾 -->
        <footer class="text-center text-[10px] text-[#B8B8B6] pt-2">
            蝴蝶邨 ⇄ 屯門碼頭交通動態面板
        </footer>
    </div>

    <script>
        // 計算剩餘分鐘數
        function getMinutes(etaString) {
            if (!etaString) return null;
            const diff = new Date(etaString) - new Date();
            const mins = Math.round(diff / 60000);
            return mins <= 0 ? '即將到達' : mins + ' 分鐘';
        }

        // 渲染最近 3 個班次
        function renderEtas(elementId, etaList) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            
            if (!etaList || etaList.length === 0) {
                container.innerHTML = '<span class="text-stone-400 bg-stone-50 px-2 py-1 rounded">暫無班次</span>';
                return;
            }

            etaList.slice(0, 3).forEach(item => {
                const timeText = getMinutes(item.eta);
                const span = document.createElement('span');
                span.className = 'bg-[#F2F2F0] px-2.5 py-1 rounded text-stone-700 font-medium';
                span.innerText = timeText;
                container.appendChild(span);
            });
        }

        // 透過九巴官方 Stop API 取得指定站點的所有車次，並過濾出對應路線
        async function fetchKMBStop(stopId, route, elementId) {
            try {
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                
                // 篩選出符合該路線號碼的班次
                const filtered = result.data ? result.data.filter(item => item.route === route) : [];
                renderEtas(elementId, filtered);
            } catch (error) {
                console.error(`Error fetching ${route} at ${stopId}:`, error);
                document.getElementById(elementId).innerHTML = '<span class="text-red-500 bg-red-50 px-2 py-1 rounded text-[11px]">[Error] 無法取得數據</span>';
            }
        }

        // 總控：自動抓取所有路線
        async function fetchAllData() {
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + 
                               now.getMinutes().toString().padStart(2, '0') + ':' + 
                               now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('update-time').innerText = timeString + " (更新中...)";

            await Promise.all([
                fetchKMBStop('TM646', '59X', 'eta-59x'), // 湖景邨湖畔樓
                fetchKMBStop('TM630', '59M', 'eta-59m'), // 蝴蝶邨蝶心樓
                fetchKMBStop('TM630', '59A', 'eta-59a'), // 蝴蝶邨蝶心樓
                fetchKMBStop('TM630', 'N260', 'eta-n260'),// 蝴蝶邨蝶心樓
                fetchKMBStop('TM630', '259B', 'eta-259b') // 蝴蝶邨蝶心樓
            ]);

            document.getElementById('update-time').innerText = timeString;
        }

        // 網頁載入時自動執行
        window.onload = function() {
            fetchAllData();
        };
    </script>
</body>
</html>
