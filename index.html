<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>蝴蝶邨 · 屯門碼頭 交通實時</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');
        * { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        body { background: #f8f8f6; }
        .card { background: white; border-radius: 1.25rem; padding: 1rem 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f0ed; }
        .eta-badge { background: #f2f2f0; padding: 0.2rem 0.8rem; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: #1f1f1f; white-space: nowrap; }
        .tag { display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 0.1rem 0.6rem; border-radius: 999px; letter-spacing: 0.02em; }
        .tag-九巴 { background: #e5e7eb; color: #1f2937; }
        .tag-城巴 { background: #fef3c7; color: #92400e; }
        .tag-龍運 { background: #d1fae5; color: #065f46; }
        .tag-港鐵巴士 { background: #dbeafe; color: #1e40af; }
        .tag-輕鐵 { background: #f3e8ff; color: #6b21a8; }
        .tag-小巴 { background: #fce7f3; color: #9d174d; }
        .refresh-spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .route-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #f5f5f3; }
        .route-row:last-child { border-bottom: none; }
        .debug-log { font-size: 0.65rem; color: #555; margin-top: 0.5rem; max-height: 150px; overflow-y: auto; background: #f0f0ee; padding: 0.5rem 0.75rem; border-radius: 8px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
        .company-section { margin-bottom: 1.5rem; }
    </style>
</head>
<body class="text-[#1c1c1c] min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-lg space-y-5 pb-10">

        <header class="flex justify-between items-start">
            <div>
                <h1 class="text-xl font-bold tracking-tight">🚌 蝴蝶邨 · 屯門碼頭</h1>
                <p class="text-xs text-[#888] mt-0.5">更新時間：<span id="update-time" class="font-medium">載入中...</span></p>
            </div>
            <button id="refresh-btn" onclick="fetchAllData()" class="bg-white border border-[#e5e5e3] hover:bg-[#f0f0ee] px-4 py-2 rounded-full text-sm font-medium transition flex items-center gap-2 shadow-sm">
                <span id="refresh-icon">⟳</span> 重整
            </button>
        </header>
        <div class="text-right text-[11px] text-[#aaa] -mt-2">下次更新：<span id="countdown">30</span> 秒</div>

        <!-- 巴士区域（动态生成） -->
        <div id="app"></div>

        <!-- 轻铁区域（独立） -->
        <section class="card" id="lr-section">
            <div class="flex items-center gap-2 mb-3">
                <span class="tag tag-輕鐵">輕鐵</span>
                <span class="text-sm font-medium text-[#555]">實時班次</span>
            </div>
            <div id="lr-container" class="space-y-1">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </section>

        <!-- 專線小巴 -->
        <section class="card">
            <div class="flex items-center gap-2 mb-3"><span class="tag tag-小巴">專線小巴</span><span class="text-sm font-medium text-[#555]">路線資訊</span></div>
            <div class="route-row"><span><span class="font-semibold">44</span> <span class="text-xs text-[#888]">屯門碼頭 ↔ 上水</span></span><span class="text-xs text-[#aaa]">請用官方 App</span></div>
            <div class="route-row"><span><span class="font-semibold">N44B</span> <span class="text-xs text-[#888]">屯門碼頭 ↔ 落馬洲</span></span><span class="text-xs text-[#aaa]">請用官方 App</span></div>
        </section>

        <details class="text-xs text-[#888]">
            <summary class="cursor-pointer font-medium">🔍 查看詳細除錯日誌</summary>
            <div id="debug-log" class="debug-log">等待數據...</div>
        </details>

        <footer class="text-center text-[10px] text-[#bbb] pt-2 border-t border-[#eee]">
            數據來源：data.hkbus.app (GitHub) · rt.data.gov.hk (輕鐵)
        </footer>
    </div>

    <script>
        // 公司标签
        const COMPANY_LABELS = {
            'kmb': '九巴', 'lwb': '龍運', 'ctb': '城巴', 'mtr': '港鐵巴士'
        };

        // ========== 巴士硬编码列表（与Python同步） ==========
        const BUS_ITEMS = [
            { company: 'kmb', route: '59X',  stop_id: 'TM648', display_name: '湖景邨湖翠樓' },
            { company: 'kmb', route: '59M',  stop_id: 'TM671', display_name: '蝴蝶站' },
            { company: 'kmb', route: '259D', stop_id: 'TM648', display_name: '湖景邨湖翠樓' },
            { company: 'lwb', route: 'A33',  stop_id: 'TM436', display_name: '兆山苑柳景閣' },
            { company: 'lwb', route: 'E33',  stop_id: 'TM436', display_name: '兆山苑柳景閣' },
            { company: 'lwb', route: 'E33P', stop_id: 'TM436', display_name: '兆山苑柳景閣' },
            { company: 'lwb', route: 'A34',  stop_id: 'TM436', display_name: '兆山苑柳景閣' },
            { company: 'ctb', route: '962X', stop_id: 'TM453', display_name: '湖景邨湖畔樓' },
            { company: 'mtr', route: 'K52',  stop_id: 'TM630', display_name: '蝴蝶邨蝶心樓' },
            { company: 'mtr', route: '506',  stop_id: 'TM630', display_name: '蝴蝶邨蝶心樓' }
        ];

        let countdownValue = 30;
        let timer = null;

        function getMinutes(etaStr) {
            if (!etaStr) return null;
            const diff = new Date(etaStr) - new Date();
            const mins = Math.round(diff / 60000);
            if (mins <= 0) return '🚀 即將到達';
            if (mins < 1) return '<1 分鐘';
            return mins + ' 分鐘';
        }

        function renderEtas(etaList) {
            if (!etaList || etaList.length === 0) return '<span class="eta-badge text-sm text-stone-400">暫無班次</span>';
            const times = etaList.slice(0, 3).map(item => getMinutes(item.eta)).filter(Boolean);
            if (times.length === 0) return '<span class="eta-badge text-sm text-stone-400">暫無班次</span>';
            return `<span class="eta-badge text-sm font-semibold text-stone-800">${times.join(' · ')}</span>`;
        }

        function addLog(msg) {
            const logEl = document.getElementById('debug-log');
            if (logEl) {
                const time = new Date().toLocaleTimeString();
                logEl.innerHTML += `[${time}] ${msg}\n`;
                logEl.scrollTop = logEl.scrollHeight;
            }
        }

        // 构建巴士 UI
        function buildBusUI() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            const groups = {};
            BUS_ITEMS.forEach(item => {
                if (!groups[item.company]) groups[item.company] = [];
                groups[item.company].push(item);
            });

            for (const [company, list] of Object.entries(groups)) {
                const section = document.createElement('section');
                section.className = 'card company-section';
                const label = COMPANY_LABELS[company] || company.toUpperCase();
                section.innerHTML = `
                    <div class="flex items-center gap-2 mb-3">
                        <span class="tag tag-${label}">${label}</span>
                        <span class="text-sm font-medium text-[#555]">實時班次</span>
                    </div>
                    <div class="space-y-1" id="container-${company}"></div>
                `;
                app.appendChild(section);
                const container = document.getElementById(`container-${company}`);
                list.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'route-row';
                    row.dataset.route = item.route;
                    row.dataset.stop = item.stop_id;
                    row.innerHTML = `
                        <span><span class="font-semibold">${item.route}</span> <span class="text-xs text-[#888]">${item.display_name}</span></span>
                        <span id="eta-bus-${item.company}-${item.route}-${item.stop_id}" class="eta-badge text-sm">讀取中</span>
                    `;
                    container.appendChild(row);
                });
            }
        }

        // 更新巴士 ETA
        function updateBus(data) {
            data.bus_items.forEach(item => {
                const el = document.getElementById(`eta-bus-${item.company}-${item.route}-${item.stop_id}`);
                if (el) el.outerHTML = renderEtas(item.etas);
            });
        }

        // 构建轻铁 UI（初始占位）
        function buildLrUI() {
            const container = document.getElementById('lr-container');
            // 清空，之后由数据填充
            container.innerHTML = '';
        }

        // 更新轻铁
        function updateLr(data) {
            const container = document.getElementById('lr-container');
            container.innerHTML = '';
            if (!data.lr_items || data.lr_items.length === 0) {
                container.innerHTML = '<div class="route-row"><span class="text-sm text-stone-400">暫無數據</span></div>';
                return;
            }
            // 按站名分组
            const groups = {};
            data.lr_items.forEach(item => {
                const key = item.station_name;
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });
            for (const [station, items] of Object.entries(groups)) {
                // 添加站名标题
                const title = document.createElement('div');
                title.className = 'text-xs font-semibold text-[#888] mt-2 mb-1';
                title.innerText = `📍 ${station}`;
                container.appendChild(title);
                items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'route-row';
                    row.innerHTML = `
                        <span><span class="font-semibold">${item.route}</span></span>
                        <span>${renderEtas(item.etas)}</span>
                    `;
                    container.appendChild(row);
                });
            }
        }

        async function fetchAllData() {
            const icon = document.getElementById('refresh-icon');
            icon.className = 'refresh-spin';
            addLog('開始更新...');

            try {
                const response = await fetch('eta-data.json?t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const now = new Date(data.timestamp || Date.now());
                document.getElementById('update-time').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });

                // 更新巴士
                if (data.bus_items) {
                    updateBus(data);
                }
                // 更新轻铁
                if (data.lr_items) {
                    updateLr(data);
                }

                addLog('更新完成');
            } catch (err) {
                addLog(`錯誤: ${err.message}`);
            } finally {
                icon.className = '';
                countdownValue = 30;
                document.getElementById('countdown').textContent = countdownValue;
            }
        }

        function startCountdown() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                countdownValue--;
                if (countdownValue <= 0) {
                    fetchAllData();
                    countdownValue = 30;
                }
                document.getElementById('countdown').textContent = countdownValue;
            }, 1000);
        }

        window.onload = function() {
            buildBusUI();
            buildLrUI();   // 先建空架子
            fetchAllData();
            startCountdown();
        };
    </script>
</body>
</html>
