<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝴蝶邨・屯門碼頭交通時間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap');
        body { font-family: 'Noto Serif TC', serif; }
    </style>
</head>
<body class="bg-[#FBFBFA] text-[#222222] min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md space-y-6 pb-8">
        
        <!-- 標題與更新時間 -->
        <header class="py-4 border-b border-[#E5E5E3] flex justify-between items-end">
            <div>
                <h1 class="text-lg font-semibold tracking-wider">此刻 · 交通</h1>
                <p class="text-[11px] text-[#777] mt-1">更新時間：<span id="update-time">載入中...</span></p>
            </div>
            <button onclick="fetchAllData()" class="text-xs bg-[#EFEFED] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-lg text-[#555] transition">
                重新整理 ⟳
            </button>
        </header>

        <!-- 九巴 (KMB) -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">九巴 (KMB) 實時班次</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">59X <span class="text-[10px] text-[#999]">屯門碼頭總站</span></span>
                    </div>
                    <div id="eta-59x" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">59M <span class="text-[10px] text-[#999]">屯門碼頭總站</span></span>
                    </div>
                    <div id="eta-59m" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">259B <span class="text-[10px] text-[#999]">蝴蝶邨蝶心樓</span></span>
                    </div>
                    <div id="eta-259b" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 港鐵巴士 (MTR Bus) -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">港鐵巴士 (MTR Bus)</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                <div class="border-b border-[#F9F9F8] pb-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">K52 <span class="text-[10px] text-[#999]">屯門碼頭總站</span></span>
                    </div>
                    <div id="eta-k52" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">506 <span class="text-[10px] text-[#999]">屯門碼頭</span></span>
                    </div>
                    <div id="eta-506" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 城巴 (CTB) -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">城巴 (CTB)</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-medium text-sm">962X <span class="text-[10px] text-[#999]">屯門碼頭總站</span></span>
                    </div>
                    <div id="eta-962x" class="text-xs text-[#666] flex gap-2 flex-wrap">
                        <span class="bg-[#F2F2F0] px-2 py-1 rounded">讀取中...</span>
                    </div>
                </div>
            </div>
        </section>

        <footer class="text-center text-[10px] text-[#B8B8B6] pt-2">
            蝴蝶邨 ⇄ 屯門碼頭交通動態面板
        </footer>
    </div>

    <script>
        // 輔助：計算剩餘分鐘
        function getMinutes(etaString) {
            if (!etaString) return null;
            const diff = new Date(etaString) - new Date();
            const mins = Math.round(diff / 60000);
            return mins <= 0 ? '即將到達' : mins + ' 分鐘';
        }

        // 渲染最近 3 個班次
        function renderEtas(elementId, etaList) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            if (!etaList || etaList.length === 0) {
                container.innerHTML = '<span class="text-stone-400 bg-stone-50 px-2 py-1 rounded">暫無班次</span>';
                return;
            }
            etaList.slice(0, 3).forEach(item => {
                const timeText = getMinutes(item.eta);
                const span = document.createElement('span');
                span.className = 'bg-[#F2F2F0] px-2.5 py-1 rounded text-stone-700 font-medium';
                span.innerText = timeText;
                container.appendChild(span);
            });
        }

        // ----- 九巴 (KMB) -----
        async function fetchKMB(route, elementId) {
            try {
                const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/TM883');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const result = await response.json();
                const filtered = (result.data || []).filter(item => item.route === route);
                renderEtas(elementId, filtered);
            } catch (error) {
                console.error(`KMB ${route} error:`, error);
                document.getElementById(elementId).innerHTML = '<span class="text-red-500 bg-red-50 px-2 py-1 rounded text-[11px]">無法取得數據</span>';
            }
        }

        // ----- 港鐵巴士 (MTR Bus) -----
        async function fetchMTRBus(route, elementId) {
            try {
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/bus/eta?route=${route}`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const result = await response.json();
                // 過濾出屯門碼頭相關站點（站名含「碼頭」或「Ferry」）
                let etas = [];
                if (result.bus && result.bus.eta) {
                    const all = result.bus.eta;
                    // 先嘗試找包含「碼頭」或「Ferry」的站
                    const filtered = all.filter(item => 
                        (item.stopName && (item.stopName.includes('碼頭') || item.stopName.includes('Ferry')))
                    );
                    etas = filtered.length > 0 ? filtered : all; // 若無匹配則顯示全部
                }
                renderEtas(elementId, etas);
            } catch (error) {
                console.error(`MTR Bus ${route} error:`, error);
                document.getElementById(elementId).innerHTML = '<span class="text-red-500 bg-red-50 px-2 py-1 rounded text-[11px]">無法取得數據</span>';
            }
        }

        // ----- 城巴 (CTB) 使用正確的 stopId -----
        async function fetchCitybus(route, elementId) {
            const stopId = '001410'; // 屯門碼頭總站的城巴站編號
            try {
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/citybus/eta/ctb/${stopId}/${route}`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const result = await response.json();
                const etas = result.data || [];
                renderEtas(elementId, etas);
            } catch (error) {
                console.error(`Citybus ${route} error:`, error);
                document.getElementById(elementId).innerHTML = '<span class="text-red-500 bg-red-50 px-2 py-1 rounded text-[11px]">無法取得數據</span>';
            }
        }

        // ----- 總控：一次抓取所有數據 -----
        async function fetchAllData() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-HK', { hour12: false }) + 
                               ' (' + now.toLocaleDateString('zh-HK') + ')';
            document.getElementById('update-time').innerText = timeString + ' (更新中...)';

            await Promise.all([
                fetchKMB('59X', 'eta-59x'),
                fetchKMB('59M', 'eta-59m'),
                fetchKMB('259B', 'eta-259b'),
                fetchMTRBus('K52', 'eta-k52'),
                fetchMTRBus('506', 'eta-506'),
                fetchCitybus('962X', 'eta-962x')
            ]);

            document.getElementById('update-time').innerText = timeString;
        }

        window.onload = fetchAllData;
    </script>
</body>
</html>
