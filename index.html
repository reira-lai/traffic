<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝴蝶邨・屯門碼頭交通指南</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap');
        body { font-family: 'Noto Serif TC', serif; }
    </style>
</head>
<body class="bg-[#FBFBFA] text-[#222222] min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md space-y-6 pb-8">
        
        <!-- 標題 -->
        <header class="flex justify-between items-center py-4 border-b border-[#E5E5E3]">
            <div>
                <h1 class="text-lg font-semibold tracking-wider">此刻 · 交通</h1>
                <p class="text-[11px] text-[#777]">蝴蝶邨 ⇄ 屯門碼頭快捷導航</p>
            </div>
            <span class="text-[11px] bg-[#EFEFED] px-2.5 py-1 rounded-lg text-[#555]">
                實用直達版
            </span>
        </header>

        <!-- 區塊：往市區方向 -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">往市區方向 (九龍 / 港島)</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                
                <!-- 59X -->
                <div class="flex justify-between items-center border-b border-[#F9F9F8] pb-3">
                    <div>
                        <span class="font-medium text-sm">59X</span>
                        <span class="text-[10px] text-[#999] block">往旺角東站 (屯門碼頭總站)</span>
                    </div>
                    <a href="https://search.kmb.hk/KMBWebSite/?action=searchroute&route=59X" target="_blank" class="text-xs bg-[#F2F2F0] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-md text-[#444] transition font-medium">
                        查實時 ↗
                    </a>
                </div>

                <!-- 962系列 -->
                <div class="flex justify-between items-center border-b border-[#F9F9F8] pb-3">
                    <div>
                        <span class="font-medium text-sm">962 / 962X</span>
                        <span class="text-[10px] text-[#999] block">往銅鑼灣 / 中環 (城巴)</span>
                    </div>
                    <a href="https://rt.bav.hket.com/" target="_blank" class="text-xs bg-[#F2F2F0] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-md text-[#444] transition font-medium">
                        查實時 ↗
                    </a>
                </div>

                <!-- 機場巴士 -->
                <div class="flex justify-between items-center">
                    <div>
                        <span class="font-medium text-sm">A33 / E33</span>
                        <span class="text-[10px] text-[#999] block">往機場 / 東涌</span>
                    </div>
                    <a href="https://rt.data.gov.hk/v1/transport/citybus/route/E33" target="_blank" class="text-xs bg-[#F2F2F0] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-md text-[#444] transition font-medium">
                        查實時 ↗
                    </a>
                </div>

            </div>
        </section>

        <!-- 區塊：區內 / 輕鐵及接駁方向 -->
        <section>
            <h2 class="text-[10px] font-bold text-[#888] tracking-[0.2em] uppercase mb-3 ml-1">區內 / 輕鐵樞紐</h2>
            <div class="bg-white border border-[#E5E5E3] rounded-xl p-4 shadow-sm space-y-4">
                
                <!-- 輕鐵 蝴蝶站 -->
                <div class="flex justify-between items-center border-b border-[#F9F9F8] pb-3">
                    <div>
                        <span class="font-medium text-sm">輕鐵 507 / 610</span>
                        <span class="text-[10px] text-[#999] block">蝴蝶站 (往兆康/元朗方向)</span>
                    </div>
                    <a href="https://www.MTR.com.hk/ch/customer/services/next-train.html" target="_blank" class="text-xs bg-[#F2F2F0] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-md text-[#444] transition font-medium">
                        港鐵查閱 ↗
                    </a>
                </div>

                <!-- 輕鐵 屯門碼頭 -->
                <div class="flex justify-between items-center border-b border-[#F9F9F8] pb-3">
                    <div>
                        <span class="font-medium text-sm">輕鐵 507 / 615 / 615P</span>
                        <span class="text-[10px] text-[#999] block">屯門碼頭總站</span>
                    </div>
                    <a href="https://www.MTR.com.hk/ch/customer/services/next-train.html" target="_blank" class="text-xs bg-[#F2F2F0] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-md text-[#444] transition font-medium">
                        港鐵查閱 ↗
                    </a>
                </div>

                <!-- K52 -->
                <div class="flex justify-between items-center">
                    <div>
                        <span class="font-medium text-sm">K52 / K52A</span>
                        <span class="text-[10px] text-[#999] block">屯門碼頭總站 (往屯門站)</span>
                    </div>
                    <a href="https://search.kmb.hk/KMBWebSite/?action=searchroute&route=K52" target="_blank" class="text-xs bg-[#F2F2F0] hover:bg-[#E5E5E3] px-3 py-1.5 rounded-md text-[#444] transition font-medium">
                        查實時 ↗
                    </a>
                </div>

            </div>
        </section>

        <!-- 頁尾 -->
        <footer class="text-center text-[10px] text-[#B8B8B6] pt-2">
            極簡導航 · 一鍵直達官方實時數據
        </footer>
    </div>

</body>
</html>
